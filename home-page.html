<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="home-page.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" href="img/uma.jpg">
</head>
<body>
    <!--  Navigation Bar -->
    <nav>
        <div class="menu-btn" id="menu-btn" onclick="menu()"><img src="/img/menu.png" alt="menu-icon" width="40" id="menu-icon"></div>
        <label class="logo" onclick="document.location='index.html'" id="logo-el"> UMA </label>

        <ul id="menu">
            <li><a href="home-page.html" id="home"> Home</a></li>
            <li><a href="about-page.html" id="about">About</a></li>
            <li><a href="product-page.html" id="products">Products</a></li>
            <li><a href="review-page.html" id="review">Review</a></li>
            <li><a href="#">Login</a></li>
        </ul>
    </nav>

    <!-- Brand Advertisement -->
    <main class="container py-5">    
        <div class="brand-advertise">
            <div class="brand-advertise-text">
                <h2> Bring <br>Smart <br>to Life</h2>
                <p> Unique smart phones <br>for everyone and <br>any species on earth</p>
                <button onclick="document.location='product-page.html'"> Shop Now</button>

            </div>

            <div class="brand-img">
                <img src="/img/uma.jpg" alt="nothing phone">
            </div>

        </div>
    </main>
    
    <!-- Best Sellers Bar -->
    <div class="best-sellers-bar">
        <p class="text1"> Best Sellers</p>
        <p class="text2" onclick="document.location='product-page.html'"> Views all <i class="bi-arrow-right"></i></p>
    </div>

    <!-- Phone Showcase -->
    <section class="container-fluid py-5">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <a href="product1.html" class="phone-link">
                    <div class="box">
                        <img src="/phone-photos/iphone17.png" alt="iphone 17" class="phone-photo">
                        <p class="phone-name">iPhone 17</p>
                        <p class="phone-price"> $ 899 </p>
                    </div>
                </a>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <a href="product2.html" class="phone-link">
                    <div class="box">
                        <img src="/phone-photos/xiaomi15.png" alt="xiaomi 15" class="phone-photo2">
                        <p class="phone-name">Xiaomi 15</p>
                        <p class="phone-price"> $ 620 </p>
                    </div>
                </a>
                
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <a href="product3.html" class="phone-link">
                    <div class="box">
                        <img src="/phone-photos/xiaomi17Ultra.png" alt="xiaomi 17 ultra" class="phone-photo3">
                        <p class="phone-name">Xiaomi 17 Ultra</p>
                        <p class="phone-price"> $ 1225 </p>
                    </div>
                </a>
                
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <a href="product4.html" class="phone-link">
                    <div class="box">
                        <img src="/phone-photos/redmiNote15Pro.png" alt="redmi note 15 pro" class="phone-photo4">
                        <p class="phone-name">Redmi Note 15 Pro</p>
                        <p class="phone-price"> $ 359 </p>
                    </div>
                </a>
            </div>
        </div>
    </section>


   
    <script src="main-page.js"></script>
</body> 
</html>
